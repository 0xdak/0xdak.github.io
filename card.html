<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ali Dak — Digital Card</title>
  <meta name="description" content="Ali Dak · Cybersecurity entrepreneur. Save to contacts.">
  <meta name="theme-color" content="#0d0c0a">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">

  <link rel="icon" type="image/svg+xml" href="/assets/img/favicons/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/favicons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicons/favicon-16x16.png">
  <link rel="shortcut icon" href="/assets/img/favicons/favicon.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-K537JG6SWP"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-K537JG6SWP');
  </script>

  <style>
    :root { --bg:#0d0c0a; --bg2:#13110e; --line:#2a261f; --line2:#3b352b; --fg:#ece6d7; --muted:#a59d8c; --acc:#ffb547; --ink:#140e04;
      --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    *, *::before, *::after { box-sizing: border-box; }
    html { background:var(--bg); }
    body { margin:0; background:var(--bg); color:var(--fg); font:400 .9375rem/1.6 var(--mono); -webkit-font-smoothing:antialiased; overflow-x:hidden; }
    body::after { content:""; position:fixed; inset:0; pointer-events:none; background:repeating-linear-gradient(to bottom, transparent 0 2px, rgb(0 0 0 / .2) 2px 3px); opacity:.2; }
    ::selection { background:var(--acc); color:var(--ink); }
    html[data-lang="en"] .lang-tr, html[data-lang="tr"] .lang-en { display:none; }
    .card { max-width:27rem; margin:0 auto; padding:2.5rem 1.25rem 3rem; }
    .toolbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:2.5rem; font-size:.75rem; color:var(--muted); }
    .toolbar .ps { color:var(--acc); }
    .lang { font:500 .75rem/1 var(--mono); color:var(--fg); background:var(--bg2); border:1px solid var(--line2); border-radius:2px; padding:.5rem .65rem; cursor:pointer; }
    .lang:hover { color:var(--acc); border-color:var(--acc); }
    .eyebrow { font-size:.75rem; letter-spacing:.08em; text-transform:uppercase; color:var(--acc); margin:0; }
    .eyebrow::before { content:"> "; }
    .title { font-size:.875rem; color:var(--muted); margin:0; }
    h1 { font-size:clamp(2.5rem, 13vw, 3.25rem); font-weight:800; line-height:1; margin:.5rem 0 .6rem; letter-spacing:-.05em; }
    h1::after { content:""; display:inline-block; width:.45em; height:.09em; margin-left:.1em; background:var(--acc); animation:b 1.1s steps(1) infinite; }
    @keyframes b { 50% { opacity:0; } }
    .links { margin:2.25rem 0; border:1px solid var(--line); background:var(--bg2); border-radius:3px; }
    .link-row { display:flex; justify-content:space-between; align-items:baseline; gap:1rem; padding:.95rem 1rem; border-bottom:1px solid var(--line); color:inherit; text-decoration:none; transition:background .15s; }
    .link-row:last-child { border-bottom:0; }
    .link-row:hover { background:#1a1713; }
    .link-row .label { font-size:.75rem; color:var(--muted); flex:none; }
    .link-row .label::before { content:"$ "; color:var(--acc); }
    .link-row .value { text-align:right; overflow-wrap:anywhere; }
    .link-row:hover .value { color:var(--acc); }
    a:focus-visible, button:focus-visible { outline:2px solid var(--acc); outline-offset:2px; border-radius:2px; }
    .save-btn { width:100%; font:700 .9375rem/1 var(--mono); color:var(--ink); background:var(--acc); border:1px solid var(--acc); border-radius:2px; padding:1.05rem; cursor:pointer; transition:background .15s, color .15s; }
    .save-btn:hover { background:transparent; color:var(--acc); }
    .foot { margin-top:1.5rem; font-size:.75rem; color:var(--muted); text-align:center; }
    .foot a { color:inherit; }
    .foot a:hover { color:var(--acc); }
    @media (prefers-reduced-motion: reduce) { h1::after { animation:none; } .link-row, .save-btn { transition:none; } }
  </style>
</head>
<body>
  <main class="card">

    <div class="toolbar">
      <span aria-hidden="true"><span class="ps">$</span> cat ali-dak.vcf</span>
      <button class="lang" id="lang-btn" aria-label="Toggle language">
        <span class="lang-en">TR</span><span class="lang-tr">EN</span>
      </button>
    </div>

    <p class="eyebrow">
      <span class="lang-en">Cybersecurity entrepreneur</span>
      <span class="lang-tr">Siber güvenlik girişimcisi</span>
    </p>
    <h1>Ali Dak</h1>
    <p class="title">
      <span class="lang-en">Founder · vulntracker.io</span>
      <span class="lang-tr">Kurucu · vulntracker.io</span>
    </p>

    <div class="links">
      <a class="link-row" href="tel:+905366516355" id="row-phone">
        <span class="label"><span class="lang-en">Phone</span><span class="lang-tr">Telefon</span></span>
        <span class="value" id="phone-value">+90 536 651 63 55</span>
      </a>
      <a class="link-row" href="mailto:alidak583@gmail.com">
        <span class="label">Email</span>
        <span class="value">alidak583@gmail.com</span>
      </a>
      <a class="link-row" href="https://www.linkedin.com/in/ali-dak" target="_blank" rel="noopener">
        <span class="label">LinkedIn</span>
        <span class="value">/in/ali-dak</span>
      </a>
      <a class="link-row" href="https://x.com/0xdak_" target="_blank" rel="noopener">
        <span class="label">X</span>
        <span class="value">@0xdak_</span>
      </a>
      <a class="link-row" href="https://github.com/0xdak" target="_blank" rel="noopener">
        <span class="label">GitHub</span>
        <span class="value">0xdak</span>
      </a>
    </div>

    <button class="save-btn" id="save-vcard">
      <span class="lang-en">Save to contacts</span>
      <span class="lang-tr">Rehbere ekle</span>
    </button>

    <p class="foot"><a href="/">yuznumara.com</a></p>

  </main>

  <script>
    /* ---------- Language ---------- */
    const html = document.documentElement;
    const browserTR = (navigator.language || '').toLowerCase().startsWith('tr');
    const savedLang = localStorage.getItem('cardLang');
    const params = new URLSearchParams(location.search);
    const urlLang = params.get('lang');
    const initialLang = urlLang || savedLang || (browserTR ? 'tr' : 'en');
    html.dataset.lang = initialLang === 'tr' ? 'tr' : 'en';

    document.getElementById('lang-btn').addEventListener('click', () => {
      const next = html.dataset.lang === 'tr' ? 'en' : 'tr';
      html.dataset.lang = next;
      localStorage.setItem('cardLang', next);
    });

    /* ---------- vCard download ---------- */
    document.getElementById('save-vcard').addEventListener('click', () => {
      const phone = document.getElementById('phone-value').textContent.trim().replace(/\s/g, '');
      const vcard = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        'N:Dak;Ali;;;',
        'FN:Ali Dak',
        'ORG:vulntracker.io',
        'TITLE:Cybersecurity Entrepreneur',
        'TEL;TYPE=CELL:' + phone,
        'EMAIL:alidak583@gmail.com',
        'URL:https://vulntracker.io',
        'URL;TYPE=LinkedIn:https://www.linkedin.com/in/ali-dak',
        'URL;TYPE=Twitter:https://x.com/0xdak_',
        'URL;TYPE=GitHub:https://github.com/0xdak',
        'END:VCARD'
      ].join('\r\n');

      const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'ali-dak.vcf';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });
  </script>
</body>
</html>

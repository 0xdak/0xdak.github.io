<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ali Dak — Digital Card</title>
  <meta name="description" content="Ali Dak · Cybersecurity entrepreneur. Save to contacts.">
  <meta name="theme-color" content="#fbfbf9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131312" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">

  <link rel="icon" type="image/svg+xml" href="/assets/img/favicons/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/favicons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicons/favicon-16x16.png">
  <link rel="shortcut icon" href="/assets/img/favicons/favicon.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-K537JG6SWP"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-K537JG6SWP');
  </script>

  <style>
    :root { --bg:#fbfbf9; --fg:#1b1a18; --muted:#64615b; --line:#e4e2dc; --accent:#a8281e;
      --serif:"Newsreader", Georgia, "Times New Roman", serif;
      --sans:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    @media (prefers-color-scheme: dark) { :root { --bg:#131312; --fg:#e9e7e2; --muted:#9d9990; --line:#2c2b28; --accent:#f08a7e; } }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:400 1.125rem/1.5 var(--serif); -webkit-font-smoothing:antialiased; }
    ::selection { background:var(--accent); color:var(--bg); }
    html[data-lang="en"] .lang-tr, html[data-lang="tr"] .lang-en { display:none; }
    .card { max-width:26rem; margin:0 auto; padding:3.5rem 1.25rem 3rem; }
    .toolbar { display:flex; justify-content:flex-end; margin-bottom:2rem; }
    .lang { font:500 0.8125rem/1 var(--sans); color:var(--muted); background:none; border:1px solid var(--line); border-radius:4px; padding:0.45rem 0.6rem; cursor:pointer; }
    .lang:hover { color:var(--fg); }
    .eyebrow, .title { font-family:var(--sans); font-size:0.875rem; color:var(--muted); margin:0; }
    h1 { font-size:2.25rem; font-weight:500; line-height:1.1; margin:0.35rem 0; letter-spacing:-0.01em; }
    .links { margin:2rem 0; border-top:1px solid var(--line); }
    .link-row { display:flex; justify-content:space-between; align-items:baseline; gap:1rem; padding:0.9rem 0; border-bottom:1px solid var(--line); color:inherit; text-decoration:none; }
    .link-row .label { font-family:var(--sans); font-size:0.8125rem; color:var(--muted); flex:none; }
    .link-row .value { text-align:right; overflow-wrap:anywhere; text-decoration:underline; text-decoration-color:var(--line); text-underline-offset:0.2em; }
    .link-row:hover .value { text-decoration-color:var(--accent); }
    a:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:2px; }
    .save-btn { width:100%; font:500 1rem/1 var(--sans); color:var(--bg); background:var(--fg); border:0; border-radius:4px; padding:1rem; cursor:pointer; }
    .save-btn:hover { background:var(--accent); }
  </style>
</head>
<body>
  <main class="card">

    <div class="toolbar">
      <button class="lang" id="lang-btn" aria-label="Toggle language">
        <span class="lang-en">TR</span><span class="lang-tr">EN</span>
      </button>
    </div>

    <p class="eyebrow">
      <span class="lang-en">Cybersecurity entrepreneur</span>
      <span class="lang-tr">Siber güvenlik girişimcisi</span>
    </p>
    <h1>Ali Dak</h1>
    <p class="title">
      <span class="lang-en">Founder · vulntracker.io</span>
      <span class="lang-tr">Kurucu · vulntracker.io</span>
    </p>

    <div class="links">
      <a class="link-row" href="tel:+905366516355" id="row-phone">
        <span class="label"><span class="lang-en">Phone</span><span class="lang-tr">Telefon</span></span>
        <span class="value" id="phone-value">+90 536 651 63 55</span>
      </a>
      <a class="link-row" href="mailto:alidak583@gmail.com">
        <span class="label">Email</span>
        <span class="value">alidak583@gmail.com</span>
      </a>
      <a class="link-row" href="https://www.linkedin.com/in/ali-dak" target="_blank" rel="noopener">
        <span class="label">LinkedIn</span>
        <span class="value">/in/ali-dak</span>
      </a>
      <a class="link-row" href="https://x.com/0xdak_" target="_blank" rel="noopener">
        <span class="label">X</span>
        <span class="value">@0xdak_</span>
      </a>
      <a class="link-row" href="https://github.com/0xdak" target="_blank" rel="noopener">
        <span class="label">GitHub</span>
        <span class="value">0xdak</span>
      </a>
    </div>

    <button class="save-btn" id="save-vcard">
      <span class="lang-en">Save to contacts</span>
      <span class="lang-tr">Rehbere ekle</span>
    </button>

  </main>

  <script>
    /* ---------- Language ---------- */
    const html = document.documentElement;
    const browserTR = (navigator.language || '').toLowerCase().startsWith('tr');
    const savedLang = localStorage.getItem('cardLang');
    const params = new URLSearchParams(location.search);
    const urlLang = params.get('lang');
    const initialLang = urlLang || savedLang || (browserTR ? 'tr' : 'en');
    html.dataset.lang = initialLang === 'tr' ? 'tr' : 'en';

    document.getElementById('lang-btn').addEventListener('click', () => {
      const next = html.dataset.lang === 'tr' ? 'en' : 'tr';
      html.dataset.lang = next;
      localStorage.setItem('cardLang', next);
    });

    /* ---------- vCard download ---------- */
    document.getElementById('save-vcard').addEventListener('click', () => {
      const phone = document.getElementById('phone-value').textContent.trim().replace(/\s/g, '');
      const vcard = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        'N:Dak;Ali;;;',
        'FN:Ali Dak',
        'ORG:vulntracker.io',
        'TITLE:Cybersecurity Entrepreneur',
        'TEL;TYPE=CELL:' + phone,
        'EMAIL:alidak583@gmail.com',
        'URL:https://vulntracker.io',
        'URL;TYPE=LinkedIn:https://www.linkedin.com/in/ali-dak',
        'URL;TYPE=Twitter:https://x.com/0xdak_',
        'URL;TYPE=GitHub:https://github.com/0xdak',
        'END:VCARD'
      ].join('\r\n');

      const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'ali-dak.vcf';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });
  </script>
</body>
</html>
